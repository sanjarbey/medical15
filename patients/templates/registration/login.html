<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Tizimga kirish - AI-HIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow-lg" style="width: 400px;">
    <div class="card-header bg-primary text-white text-center">
        <h4 class="mb-0">🏥 AI-HIS Tizimiga kirish</h4>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Foydalanuvchi nomi (Login):</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Parol:</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Tizimga kirish</button>
            
            {% if form.errors %}
            <div class="alert alert-danger mt-3 pb-0 pt-2">
                <p>Login yoki parol xato! Qaytadan urinib ko'ring.</p>
            </div>
            {% endif %}
        </form>
    </div>
</div>

</body>
</html>
