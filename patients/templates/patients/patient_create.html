<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Yangi Bemor Ro'yxatga Olish - AI-HIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5" style="max-width: 600px;">
    <div class="card shadow-sm border-primary">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">📋 Yangi Bemorni Ro'yxatga Olish</h5>
            <a href="{% url 'patient_list' %}" class="btn btn-sm btn-outline-light">Ortga</a>
        </div>
        
        <div class="card-body">
            <p class="text-muted mb-4">Ushbu shakl orqali registratura xodimi yoki hamshira tizimga yangi bemorni kiritadi.</p>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Familiyasi *</label>
                    <input type="text" name="last_name" class="form-control" placeholder="Masalan: Valiyev" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Ismi *</label>
                    <input type="text" name="first_name" class="form-control" placeholder="Masalan: Ali" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Otasining ismi</label>
                    <input type="text" name="patronymic" class="form-control" placeholder="Masalan: Vali o'g'li">
                </div>
                
                <div class="row">
                    <div class=" mb-2">
                        <label class="form-label text-dark fw-bold">Jinsi <span>*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-gender-ambiguous text-primary"></i></span>
                            <select name="gender" class="form-select bg-light" required>
                                <option value="" selected disabled>-- Jinsni tanlang --</option>
                                <option value="Erkak">Erkak</option>
                                <option value="Ayol">Ayol</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-bold">Tug'ilgan sanasi *</label>
                        <input type="date" name="date_of_birth" class="form-control" required>
                    </div>
                 </div>

                <button type="submit" class="btn btn-success btn-lg w-100">Bemorni Saqlash va Kartasini Ochish</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
